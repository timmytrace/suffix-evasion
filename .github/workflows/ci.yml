name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Dependency drift is the realistic failure mode for an eval nobody is
  # actively editing: Inspect moves, the eval stops working, and the repository
  # looks maintained right up until somebody tries to run it. A weekly run
  # catches that without anyone remembering to check.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  # Public repository, so a committed credential is readable the moment it is
  # pushed. This matters more here than the file count suggests: running the
  # eval against NVIDIA-hosted models and gated Hugging Face models means
  # `nvapi-` and `hf_` tokens are handled on the same machine as this
  # checkout, and the obvious accident is pasting one into a config example.
  #
  # Outside the matrix on purpose - the scan does not vary by Python version,
  # and running it three times would just be three chances to read the same
  # answer.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --all scans tracked files, which is what can reach the remote. The
      # local pre-commit hook is opt-in and can be bypassed with --no-verify,
      # so the same scan runs here where it cannot be skipped.
      - name: Scan tracked files for credentials
        run: python scripts/secret_scan.py --all

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # No network, no model, no credentials. The integration test runs a real
      # inspect_ai.eval() over hand-written prompts, so it covers the solver,
      # scorer and metric contracts - the things that break when Inspect moves
      # - without a bad afternoon at someone else's API turning this red.
      - name: Tests
        run: pytest suffix_evasion/ -v

  # The one thing the offline tests cannot cover: fetching a dataset and
  # running the task people actually invoke. Kept separate and non-blocking,
  # because a third-party API being down is not a defect in this repository -
  # but a silent failure here means the quickstart in the README is broken,
  # which is worth seeing.
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: The README quickstart, end to end
        run: inspect eval suffix_evasion/task.py --model none -T attacks=3
